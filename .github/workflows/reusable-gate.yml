name: Reusable Automated Quality Gate

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use'
        required: false
        default: '20'
        type: string
      sonar_enabled:
        description: 'Enable SonarCloud scan'
        required: false
        default: false
        type: boolean
      sonar_project_key:
        description: 'Your SonarCloud project key (required when enabled)'
        type: string
        default: ''
      sonar_organization:
        description: 'Your SonarCloud organization (required when enabled)'
        type: string
        default: ''
    secrets:
      GEMINI_API_KEY:
        required: true
      GITHUB_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false

jobs:
  quality-gate:
    name: Run AI Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      checks: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git diff comparison

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prepare Sonar metadata directory
        if: ${{ inputs.sonar_enabled }}
        run: mkdir -p "$GITHUB_WORKSPACE/.aq-sonar"

      - name: SonarCloud Scan
        id: sonar
        if: ${{ inputs.sonar_enabled }}
        uses: sonarsource/sonarqube-scan-action@v6
        with:
          args: >-
            -Dproject.settings=/dev/null
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}
            -Dsonar.organization=${{ inputs.sonar_organization }}
            -Dsonar.sources=src
            -Dsonar.scanner.metadataFilePath=${{ github.workspace }}/.aq-sonar/report-task.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run Automated Quality Gate
        if: always()
        uses: NonnaritRammaneekultawat-6609650459/test-github-marketplace@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          sonar_project_key: ${{ inputs.sonar_project_key }}
          sonar_scan_status: ${{ steps.sonar.outcome }}
          sonar_enabled: ${{ inputs.sonar_enabled }}
          sonar_token: ${{ inputs.sonar_enabled && secrets.SONAR_TOKEN || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN || github.token }}
