name: Automated Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read
      pull-requests: write
      statuses: write
      checks: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0 # Essential for git diff to work

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci


    - name: Prepare Sonar metadata directory
      if: ${{ vars.SONAR_ENABLED == 'true' }}
      run: mkdir -p "$GITHUB_WORKSPACE/.aq-sonar"

    - name: SonarCloud Scan
      id: sonar
      if: ${{ vars.SONAR_ENABLED == 'true' }}
      uses: sonarsource/sonarqube-scan-action@v6
      with:
        args: >-
          -Dproject.settings=/dev/null
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.sources=src
          -Dsonar.scanner.metadataFilePath=${{ github.workspace }}/.aq-sonar/report-task.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Run Automated Quality Gate
      if: always()
      uses: ./
      with:
        gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        sonar_project_key: ${{ vars.SONAR_PROJECT_KEY }}
        sonar_scan_status: ${{ steps.sonar.outcome }}
        sonar_enabled: ${{ vars.SONAR_ENABLED == 'true' }}
        sonar_token: ${{ vars.SONAR_ENABLED == 'true' && secrets.SONAR_TOKEN || '' }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
