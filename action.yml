name: 'Automated Quality Gate'
description: 'AI-driven code review and test generation using Gemini'
author: 'Nonnarit Rammaneekultawat'
inputs:
  persist_tests:
    description: 'Save generated tests to the same-repository PR branch during report; requires contents/checks write'
    default: 'false'
  ai_provider:
    description: 'API format: gemini or openai-compatible (not a model allowlist)'
    default: 'gemini'
  ai_api_url:
    description: 'Full public HTTPS Chat Completions URL for openai-compatible APIs; no query or credentials'
    required: false
  ai_model:
    description: 'User-defined model ID; overrides gemini_model'
    required: false
  ai_api_key:
    description: 'API key for openai-compatible service; never put plaintext in workflow'
    required: false
  gemini_api_key:
    description: 'Google Gemini API Key'
    required: false
  sonar_token:
    description: 'SonarCloud Token (Optional)'
    required: false
  sonar_project_key:
    description: 'SonarCloud project key for commit-bound scan reporting (JavaScript and AngularJS)'
    required: false
  sonar_scan_status:
    description: 'Result of the isolated sonar job; requires its report-task.txt in .aq-sonar/'
    required: false
  github_token:
    description: 'GitHub Token for posting PR comments'
    required: false
    default: ${{ github.token }}
  project_type:
    description: 'auto, javascript, or angularjs (AngularJS 1.x with Node tests)'
    default: 'auto'
  phase:
    description: 'generate, checks, report, or all (legacy mode); use isolated jobs for test persistence'
    default: 'all'
  test_source:
    description: 'generated: action creates AngularJS tests; existing: use consumer npm test'
    default: 'generated'
  report_only:
    description: 'Report failed/skipped checks without failing the AngularJS action'
    default: 'false'
  gemini_model:
    description: 'Gemini model used for review'
    default: 'gemini-3.1-flash-lite'
  ai_timeout_seconds:
    description: 'Time limit per Gemini request (10-180 seconds)'
    default: '60'
  install_status:
    description: 'Outcome of the caller dependency installation step'
    default: 'success'
runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'shield'
  color: 'green'
